appId: com.advx.live
productName: ADVX Live
directories:
  output: release
files:
  - out/**
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: true
extraResources:
  - from: ../backend-bun/dist
    to: backend
    filter:
      - advx-backend-bun*
mac:
  target: dmg
  extendInfo:
    NSMicrophoneUsageDescription: ADVX Live uses the selected microphone for voice interaction with AI viewers.
win:
  target: nsis
