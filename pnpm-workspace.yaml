packages:
  - apps/backend-bun
  - apps/desktop
  - packages/*

# pnpm 11 defaults this to 1440. Zero disables that built-in age gate.
minimumReleaseAge: 0

overrides:
  '@redocly/openapi-core': 1.34.18
  js-yaml: 4.3.1
  brace-expansion: 5.0.9
  fast-uri: 3.1.5
  nanoid: 3.3.17

onlyBuiltDependencies:
  - electron
  - esbuild
allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
  msw: false
